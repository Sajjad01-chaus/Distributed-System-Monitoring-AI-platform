# Load balancer in front of the API replicas (docker compose service "backend").
worker_processes auto;
events { worker_connections 16384; }

http {
    # Docker's embedded DNS. With `resolve` below, scaling the backend up/down is picked up
    # within `valid` seconds, without reloading nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api {
        zone api 64k;
        # WebSockets are long-lived: balance by open connections, not by request count.
        least_conn;
        server backend:8000 resolve max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    log_format lb '$remote_addr "$request" $status $request_time upstream=$upstream_addr';
    access_log /var/log/nginx/access.log lb buffer=64k flush=5s;

    server {
        listen 8000;

        location = /lb-health { access_log off; return 200 "ok\n"; }

        # Agent and dashboard sockets.
        location /ws/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 1h;       # agents may be quiet for a while; they reconnect anyway
            proxy_send_timeout 1h;
        }

        # REST. If a replica dies mid-request, idempotent requests are retried on another
        # one; POSTs (commands) are not, so a command is never sent twice.
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            client_max_body_size 1m;
        }
    }
}
